<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" ry="20" fill="#000000" />
  
  <!-- Image Frame -->
  <rect x="20" y="25" width="60" height="50" rx="6" ry="6" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Sun -->
  <circle cx="65" cy="40" r="6" fill="#ffffff" />
  
  <!-- Mountains -->
  <path d="M22,72 L45,45 L78,72" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Red Strike-through (with black outline to cut through the white lines cleanly) -->
  <line x1="15" y1="15" x2="85" y2="85" stroke="#000000" stroke-width="16" stroke-linecap="round" />
  <line x1="15" y1="15" x2="85" y2="85" stroke="#ff0000" stroke-width="10" stroke-linecap="round" />
</svg>